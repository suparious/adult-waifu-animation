apiVersion: v1
kind: Service
metadata:
  name: waifu-backend
  labels:
    app: waifu-animation
    component: backend
spec:
  selector:
    app: waifu-animation
    component: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  # Session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour
  type: ClusterIP
