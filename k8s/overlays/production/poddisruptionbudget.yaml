# Ensure at least 1 backend pod is available during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: waifu-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: waifu-animation
      component: backend
---
# Ensure at least 1 frontend pod is available during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: waifu-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: waifu-animation
      component: frontend
