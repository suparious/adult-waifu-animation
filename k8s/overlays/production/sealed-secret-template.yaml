# Template for creating SealedSecret
# 
# Usage:
#   1. Create a regular secret with your API key:
#      kubectl create secret generic waifu-secrets \
#        --from-literal=llm-api-key=srt_prod_YOUR_KEY_HERE \
#        --dry-run=client -o yaml > secret.yaml
#
#   2. Seal the secret:
#      kubeseal -f secret.yaml -w sealed-secret.yaml
#
#   3. Apply the sealed secret:
#      kubectl apply -f sealed-secret.yaml
#
#   4. Delete the plain secret file:
#      rm secret.yaml
#
# For now, this is a placeholder. Generate the actual sealed-secret.yaml
# using the above commands with your real API key.

apiVersion: v1
kind: Secret
metadata:
  name: waifu-secrets
type: Opaque
stringData:
  # REPLACE THIS with actual SealedSecret after running kubeseal
  llm-api-key: "PLACEHOLDER_REPLACE_WITH_SEALED_SECRET"
